# C 语言编译/运行配置
# 环境: Ubuntu (GitHub Actions ubuntu-latest)
# 版本以 actions/runner-images 预装为准; 镜像为评测仓库维护的白名单镜像

image: gcc:13-bookworm

# 编译命令（Ubuntu 环境，不使用 -static 以利用系统动态库）
compile:
  - gcc
  - -std=c11
  - -O2
  - -o
  - main
  - main.c
  - -lm

run:
  - ./main

# 内存换算系数: 语言运行时额外开销
memory_factor: 1.0

source_file: main.c
